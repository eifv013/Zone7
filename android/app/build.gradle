plugins {
    id 'com.android.application'
}

/*
 * 서명 키
 *   - 같은 키로 서명한 APK 만 기존 앱 위에 덮어 설치된다. 키가 바뀌면 지우고 다시 깔아야 한다(기기 저장도 사라진다).
 *   - 기본값은 저장소에 들어 있는 알파 테스트용 키(alpha.keystore)다. 공개 저장소에 있으므로 "비밀"이 아니다.
 *     정식 배포 전에는 GitHub Secrets 의 키로 바꿔야 한다: KEYSTORE_FILE / KEYSTORE_PASSWORD 환경 변수를 주면 그것을 쓴다.
 */
def keystoreFile = System.getenv('KEYSTORE_FILE') ?: 'alpha.keystore'
def keystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: 'zone7-alpha'

android {
    namespace 'io.github.eifv013.zone7'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.eifv013.zone7'
        minSdk 24            // 안드로이드 7.0 이상: 웹뷰가 서비스 워커(오프라인 열기)를 지원하는 최소선
        targetSdk 34         // 35 부터는 화면이 상태 표시줄 밑까지 깔리는 것이 강제된다. 게임 화면이 가려지지 않게 34 에 둔다.
        // 빌드할 때마다 1씩 오른다(GitHub Actions 의 실행 번호). 숫자가 커야 덮어 설치된다.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0'
        // 게임을 불러올 주소. 패치는 이 주소의 파일을 바꾸는 것으로 끝난다(APK 를 다시 만들 필요가 없다).
        buildConfigField 'String', 'GAME_URL', '"https://eifv013.github.io/Zone7/"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file(keystoreFile)
            storePassword keystorePassword
            keyAlias 'zone7'
            keyPassword keystorePassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false   // 코드가 파일 하나뿐이라 줄일 것이 없다
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'   // 단위 테스트(LinksTest)에만 쓴다. APK 에는 들어가지 않는다.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'                // 한글 주석과 테스트 이름
}
